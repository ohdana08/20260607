name: Collect government support programs (5 sources)

on:
  schedule:
    - cron: "0 */3 * * *" # 3시간마다 (UTC 기준)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsx scripts/collect-programs.mts
        env:
          KSTARTUP_KEY: ${{ secrets.KSTARTUP_KEY }}
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          KOCCA_KEY: ${{ secrets.KOCCA_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

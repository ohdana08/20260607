name: ddakfit-scale-lab
services:
  postgres:
    image: postgres:17-alpine
    container_name: ddakfit-scale-20260917-postgres
    environment:
      POSTGRES_USER: scale_lab
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: ddakfit_scale_lab
    ports: ["127.0.0.1:25432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scale_lab -d ddakfit_scale_lab"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: ddakfit-scale-20260917-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:26379:6379"]
